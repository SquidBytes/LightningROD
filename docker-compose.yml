# Compose project name
name: lightningrod

services:
  db:
    image: postgres:16
    container_name: lightningrod-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Stamp the version into the image at build time
        LIGHTNINGROD_VERSION: ${LIGHTNINGROD_VERSION:-dev}
    # Tag the built image as lightningrod-web:<version> 
    image: lightningrod-web:${LIGHTNINGROD_VERSION:-dev}
    container_name: lightningrod-web
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      - LIGHTNINGROD_VERSION=${LIGHTNINGROD_VERSION:-dev}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

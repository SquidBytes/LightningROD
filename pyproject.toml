[project]
name = "lightningrod"
# Versioning: v{major}.{milestone}.{phase_count} (see parent CLAUDE.md).
# This is the single source of truth — scripts/bump-version.sh mirrors it to
# package.json and .env so Docker image tags stay in lockstep.
version = "0.3.0"
description = "Self-hosted charging analytics for Ford electric vehicles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.134.0",
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.47",
    "uvicorn[standard]>=0.41.0",
    "plotly>=6.0.0",
    "pandas>=2.0.0",
    "websockets>=15.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.4",
    "hypothesis>=6.100.0",
    "mypy>=1.20.2",
    "types-python-dateutil>=2.9.0.20260408",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "db: tests requiring a real database connection",
    "ha_sim: tests using the Home Assistant WebSocket simulator",
    "query: query layer validation tests",
    "unit: pure function unit tests (no DB needed)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio",
]

[tool.ruff]
# Match the Python version declared in [project].requires-python.
target-version = "py311"
# Skip generated/vendored directories.
extend-exclude = [
    "alembic/versions",
    "node_modules",
    "site",
    ".venv",
]

[tool.ruff.lint]
# E4/E7/E9/F — pycodestyle errors + pyflakes (dead code, undefined names)
# I           — isort (import ordering)
# B           — bugbear (common gotchas; B008 excluded — FastAPI uses Depends/Form as defaults)
# UP          — pyupgrade (modernise syntax for Python 3.11+: X|None, datetime.UTC, etc.)
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = [
    "alembic/versions",
    "\\.venv",
]

[tool.ruff.lint.per-file-ignores]
# Seed scripts manipulate sys.path before importing project modules, which is
# the canonical reason to allow late module imports.
"scripts/seed.py" = ["E402"]
"scripts/seed_sample.py" = ["E402"]
"scripts/seed_review_queue.py" = ["E402"]
# web/main.py resolves APP_VERSION before importing routers. Structural, not a bug.
"web/main.py" = ["E402"]

<form hx-post="/settings/developer-mode" hx-target="#developer-settings" hx-swap="innerHTML"
      class="space-y-4">
    <label class="flex items-center gap-3 cursor-pointer p-2 rounded-lg hover:bg-base-300/50 transition-colors">
        <input type="checkbox" name="developer_mode"
               {% if settings.developer_mode == 'true' %}checked{% endif %}
               class="checkbox checkbox-sm checkbox-warning">
        <div>
            <span class="text-sm font-semibold">Enable developer tools</span>
            <p class="text-xs text-base-content/50">Shows Data Sources and other diagnostic pages in the navigation.</p>
        </div>
    </label>
    <div class="pt-1">
        <button type="submit" class="btn btn-sm btn-warning btn-outline">Save</button>
    </div>
</form>

{% if saved %}
<div class="toast toast-bottom toast-end z-50" data-auto-dismiss="3000">
  <div class="alert alert-success">
    <span>Developer settings saved.</span>
  </div>
</div>
{% endif %}

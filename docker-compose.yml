# Compose project name
name: lightningrod

services:
  db:
    image: postgres:16
    container_name: lightningrod-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    # Pull prebuilt image from GHCR for grab-and-go self-hosted deploys.
    image: ${LIGHTNINGROD_IMAGE:-ghcr.io/squidbytes/lightningrod-web}:${LIGHTNINGROD_VERSION:-latest}
    container_name: lightningrod-web
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      - LIGHTNINGROD_VERSION=${LIGHTNINGROD_VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

# Standalone compose — single web container with embedded SQLite at /data/lightningrod.db.
# Usage (from repo root): docker compose -f docker/docker-compose.standalone.yml up -d
name: lightningrod-standalone

services:
  lightningrod:
    # Same image as the default compose stack — this variant differs only
    # in env (DATABASE_URL → SQLite) and volume layout (/data instead of pgdata).
    image: ${LIGHTNINGROD_IMAGE:-ghcr.io/squidbytes/lightningrod-web}:${LIGHTNINGROD_VERSION:-latest}
    container_name: lightningrod-standalone
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file: ../.env
    # DATABASE_URL here overrides whatever is in .env so the standalone
    # variant always runs against the embedded SQLite file.
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/lightningrod.db
    volumes:
      - lightningrod-data:/data
    restart: unless-stopped

volumes:
  lightningrod-data:

# Dev overlay — exposes postgres on the host and parks the web service behind
# a "prod" profile so `docker compose up db` starts only postgres.
# Usage (from repo root): docker compose -f docker-compose.yml -f docker/docker-compose.dev.yml up db
name: lightningrod

services:
  web:
    profiles: ["prod"]
  db:
    ports:
      - "5432:5432"

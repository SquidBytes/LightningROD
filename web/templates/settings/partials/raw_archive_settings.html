<form hx-post="/settings/raw-archive" hx-target="#raw-archive-settings" hx-swap="innerHTML"
      class="space-y-4">
    <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" name="raw_archive_enabled"
               {% if raw_archive_enabled %}checked{% endif %}
               class="checkbox checkbox-sm checkbox-primary">
        <span class="label-text text-sm">Keep a copy of every Home Assistant event</span>
    </label>
    <p class="text-xs text-base-content/50 -mt-2">Lets Data Repair rebuild missing trip details from LightningROD's own records instead of Home Assistant's limited history. Archived events are included in database backups.</p>
    <label class="form-control w-36">
        <span class="label-text text-xs mb-1">Keep for (days)</span>
        <input type="number" name="raw_archive_retention_days" min="0" step="1"
               value="{{ raw_archive_retention_days }}"
               class="input input-bordered input-sm">
    </label>
    <p class="text-xs text-base-content/50 -mt-2">0 keeps events forever.</p>
    <div class="pt-1">
        <button type="submit" class="btn btn-primary btn-sm">
            Save
        </button>
    </div>
</form>

{% if saved %}
<div class="toast toast-bottom toast-end z-50" data-auto-dismiss="3000">
  <div class="alert alert-success">
    <span>Event archive settings saved.</span>
  </div>
</div>
{% endif %}

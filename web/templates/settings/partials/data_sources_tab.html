<div class="space-y-4">
    {% for card in cards %}
        {% if card.source.source_name == 'fcon' %}
            {% include "settings/partials/fcon_card.html" with context %}
        {% else %}
            {% include "settings/partials/data_source_card.html" with context %}
        {% endif %}
    {% endfor %}
</div>

{% if saved %}
<div class="toast toast-bottom toast-end z-50" data-auto-dismiss="3000">
  <div class="alert alert-success">
    <span>Settings saved.</span>
  </div>
</div>
{% endif %}

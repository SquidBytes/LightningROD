[project]
name = "lightningrod"
version = "0.5.4"
description = "Self-hosted charging and vehicle analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.52.0",
    "plotly>=6.9.0",
    "pandas>=3.0.5",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
    "hypothesis>=6.163.0",
    "mypy>=2.3.0",
    "sqlglot>=30.14.0",
    "types-python-dateutil>=2.9.0.20260716",
    "ty>=0.0.64",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "api: route-level integration tests driving the HTTP layer",
    "db: tests requiring a real database connection",
    "ha_sim: tests using the Home Assistant WebSocket simulator",
    "query: query layer validation tests",
    "unit: pure function unit tests (no DB needed)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio",
]

[tool.ruff]
# Match the Python version declared in [project].requires-python.
target-version = "py311"
# Skip generated/vendored directories.
extend-exclude = [
    "alembic/versions",
    "node_modules",
    "site",
    ".venv",
]

[tool.ruff.lint]
# E4/E7/E9/F — pycodestyle errors + pyflakes (dead code, undefined names)
# I           — isort (import ordering)
# B           — bugbear (common gotchas; B008 excluded — FastAPI uses Depends/Form as defaults)
# UP          — pyupgrade (modernise syntax for Python 3.11+: X|None, datetime.UTC, etc.)
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# Application code only — tests are unannotated by design and typing them
# adds narrowing noise without catching real bugs. Bare `mypy` therefore
# matches what CI gates on; don't pass paths on the command line.
files = ["web", "config.py", "db"]
exclude = [
    "alembic/versions",
    "\\.venv",
]
# "bodies of untyped functions are not checked" — that's the intent, not news.
disable_error_code = ["annotation-unchecked"]

[tool.ty.src]
# Same scope as mypy above: ty is being trialled alongside it, not on tests.
include = ["web", "config.py", "db"]

[tool.ruff.lint.per-file-ignores]
# web/main.py resolves APP_VERSION before importing routers. Structural, not a bug.
"web/main.py" = ["E402"]
# Root conftest resolves TEST_BACKEND -> DATABASE_URL via a helper before
# importing pytest/sqlalchemy so the production engine can't connect to dev DB
# on import. Structural, not a bug.
"tests/conftest.py" = ["E402"]

{% from "partials/timezone_picker.html" import timezone_picker %}
{% set current_tz = settings.get('user_timezone') or 'UTC' %}

<form hx-post="/settings/timezone" hx-target="#timezone-settings" hx-swap="innerHTML"
      class="space-y-4">
    <label class="form-control w-full max-w-xs">
        <div class="label"><span class="label-text font-semibold">Display Timezone</span></div>
        <p class="text-xs text-base-content/50 -mt-1 mb-1">All stored times remain in UTC. This setting controls display only.</p>
        {{ timezone_picker(name='user_timezone', value=current_tz) }}
    </label>
    <div class="pt-1">
        <button type="submit" class="btn btn-primary btn-sm">
            Save
        </button>
    </div>
</form>

{% if saved %}
<div class="toast toast-bottom toast-end z-50" data-auto-dismiss="3000">
  <div class="alert alert-success">
    <span>Timezone preference saved.</span>
  </div>
</div>
{% endif %}
